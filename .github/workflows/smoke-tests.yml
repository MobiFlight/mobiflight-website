name: Smoke Tests

on:
  # after each deploy, see azure-static-web-apps-ashy-glacier-08fec9903.yml
  workflow_call:
    inputs:
      base_url:
        description: URL of the deployed site
        required: true
        type: string
  workflow_dispatch:
    inputs:
      base_url:
        description: URL of the deployed site
        required: true
        default: https://mobiflight.com
        type: string
  # catch problems in production that aren't caused by a deploy
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  smoke_test:
    runs-on: ubuntu-latest
    name: Smoke Test
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          # scheduled runs have no inputs and test production
          BASE_URL: ${{ inputs.base_url || 'https://mobiflight.com' }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: astro/playwright-report/
          retention-days: 14
